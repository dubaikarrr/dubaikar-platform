    <text x="20" y="70" class="tw">priya.sharma@email.com · +971 50 123 4567</text>
    <!-- bar heading -->
    <rect x="20" y="108" width="240" height="14" fill="#FF6B35"/>
    <text x="26" y="118" class="sw" fill="#fff">EXPERIENCE</text>
    <text x="20" y="140" class="h">Senior Accountant · EY Dubai</text>
    <text x="20" y="153" class="t">2022 – Present · Audit &amp; assurance for UAE retail clients</text>
    <text x="20" y="166" class="t">• Led IFRS reporting for AED 80M portfolio</text>
    <text x="20" y="178" class="t">• Mentored 4 associates through busy season</text>
    <text x="20" y="195" class="h">Accountant · Deloitte Mumbai</text>
    <text x="20" y="208" class="t">2019 – 2022 · Statutory audits, tax filings, GST</text>
    <rect x="20" y="230" width="240" height="14" fill="#FF6B35"/>
