    <text x="20" y="224" class="t">• Launched Instamart campaign reaching 40M users</text>

    <text x="20" y="252" font-family="Georgia,serif" font-size="10" font-weight="700" fill="#1A1D3E" letter-spacing="2">EDUCATION</text>
    <line x1="20" y1="258" x2="220" y2="258" stroke="#FF6B35" stroke-width="0.5"/>
    <text x="20" y="274" class="h" font-size="10">MBA · IIM Bangalore</text>
    <text x="20" y="286" class="t">2018 – 2020</text>

