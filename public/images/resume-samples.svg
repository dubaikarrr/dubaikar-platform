    <line x1="116" y1="106" x2="266" y2="106" stroke="#FF6B35" stroke-width="1"/>
    <text x="116" y="122" class="h">Senior Engineer · Careem</text>
    <text x="116" y="134" class="t">2024 – Present · Dubai</text>
    <text x="116" y="148" class="t">• Shipped payments retry pipeline (+18% success)</text>
    <text x="116" y="160" class="t">• Owned Ride Plus onboarding flow</text>

    <text x="116" y="184" class="h">Engineer · Razorpay</text>
    <text x="116" y="196" class="t">2021 – 2024 · Bengaluru</text>
    <text x="116" y="210" class="t">• Built merchant dashboard used by 12k+ businesses</text>

    <text x="116" y="240" class="s">EDUCATION</text>
    <line x1="116" y1="246" x2="266" y2="246" stroke="#FF6B35" stroke-width="1"/>
    <text x="116" y="262" class="h">B.Tech CSE · BITS Pilani</text>
    <text x="116" y="274" class="t">2017 – 2021 · CGPA 8.7</text>

