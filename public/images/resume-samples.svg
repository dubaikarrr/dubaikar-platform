    <line x1="116" y1="310" x2="266" y2="310" stroke="#FF6B35" stroke-width="1"/>
    <text x="116" y="326" class="t">AWS Solutions Architect Associate</text>
    <text x="116" y="338" class="t">Google Cloud Professional Developer</text>
