    <text x="20" y="274" class="t">All India Rank 47 · 2019</text>
    <text x="20" y="290" class="h">B.Com · Mumbai University</text>
    <rect x="20" y="312" width="240" height="14" fill="#FF6B35"/>
    <text x="26" y="322" class="sw" fill="#fff">SKILLS</text>
    <g font-family="DM Sans" font-size="8" font-weight="600">
      <rect x="20" y="334" width="48" height="16" rx="8" fill="#FFE7CF"/><text x="44" y="345" text-anchor="middle" class="chip">IFRS</text>
      <rect x="74" y="334" width="48" height="16" rx="8" fill="#FFE7CF"/><text x="98" y="345" text-anchor="middle" class="chip">SAP</text>
      <rect x="128" y="334" width="58" height="16" rx="8" fill="#FFE7CF"/><text x="157" y="345" text-anchor="middle" class="chip">VAT UAE</text>
      <rect x="192" y="334" width="68" height="16" rx="8" fill="#FFE7CF"/><text x="226" y="345" text-anchor="middle" class="chip">CORP TAX</text>
    </g>
