  <!-- ATS score badge -->
  <g transform="translate(740,40)">
    <circle cx="50" cy="50" r="46" fill="#fff" filter="url(#shadow)"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="#E5E7EB" stroke-width="6"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="#FF6B35" stroke-width="6" stroke-linecap="round" stroke-dasharray="226 251" transform="rotate(-90 50 50)"/>
    <text x="50" y="48" text-anchor="middle" font-family="DM Sans" font-size="20" font-weight="800" fill="#1A1D3E">92</text>
    <text x="50" y="64" text-anchor="middle" font-family="DM Sans" font-size="7" font-weight="700" fill="#FF6B35" letter-spacing="1">ATS SCORE</text>
