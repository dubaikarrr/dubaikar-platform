<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-label="Sample Dubai-ready resumes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7EE"/>
      <stop offset="1" stop-color="#FFE7CF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1A1D3E" flood-opacity="0.18"/>
    </filter>
    <style>
      .h{font:700 13px 'DM Sans',system-ui,sans-serif;fill:#1A1D3E}
      .n{font:800 18px 'DM Sans',system-ui,sans-serif;fill:#1A1D3E}
      .nw{font:800 18px 'DM Sans',system-ui,sans-serif;fill:#fff}
      .s{font:600 9px 'DM Sans',system-ui,sans-serif;fill:#FF6B35;letter-spacing:1.2px}
      .sw{font:600 9px 'DM Sans',system-ui,sans-serif;fill:#FFB07A;letter-spacing:1.2px}
      .t{font:400 8.5px 'DM Sans',system-ui,sans-serif;fill:#4B5563}
      .tw{font:400 8.5px 'DM Sans',system-ui,sans-serif;fill:#E5E7EB}
      .chip{font:600 8px 'DM Sans',system-ui,sans-serif;fill:#FF6B35}
    </style>
  </defs>

  <rect width="900" height="620" fill="url(#bg)"/>

  <!-- RESUME 1: Corporate navy header (back-left, rotated) -->
